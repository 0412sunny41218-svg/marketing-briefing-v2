name: Daily Marketing Briefing

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 뉴스 수집 (최근 24시간)
        working-directory: scripts
        run: python fetch_news.py

      - name: 규칙 기반 요약 생성
        working-directory: scripts
        run: python summarize.py

      - name: 사이트 빌드
        working-directory: scripts
        run: python build_site.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "chore: 오늘의 마케팅 브리핑 자동 업데이트"
          git push
