<div class="article-card" data-link="{{ a.link }}" data-title="{{ a.title }}" data-source="{{ a.source }}" data-summary="{{ a.content_summary }}" data-date="{{ date }}">
  <div class="article-source">
    <span class="source-dot"></span>
    <span>{{ a.source }}</span>
    {% if a.companies %}<span>· {{ a.companies|join(', ') }}</span>{% endif %}
    <button type="button" class="save-btn" onclick="toggleSave(this)" aria-label="저장">☆</button>
  </div>
  <div class="article-title">{{ a.title }}</div>
  <div class="info-box">
    <div class="label">무슨 내용인가요?</div>
    <div class="body">{{ a.content_summary }}</div>
  </div>
  <a class="original-link" href="{{ a.link }}" target="_blank" rel="noopener">원문에서 확인 ↗</a>
</div>
