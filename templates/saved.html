<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>저장한 기사 · 오늘의 마케팅 브리핑</title>
<link rel="stylesheet" href="./static/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back-link" href="./index.html">← 홈으로</a>
  </div>
  <div class="briefing-header">
    <div class="section-title">⭐ 저장한 기사</div>
    <div class="window-note">이 브라우저에 저장해둔 기사만 모아서 보여드려요</div>
  </div>

  <div id="saved-list"></div>
  <div class="empty-note" id="empty-note" style="display:none;">
    아직 저장한 기사가 없어요. 기사 카드의 ☆ 버튼을 눌러 저장해보세요.
  </div>

  <footer class="site-footer">
    저장한 기사는 이 브라우저에만 보관돼요 (다른 기기·브라우저에는 안 보여요)
  </footer>
</div>

<script src="./static/saved.js"></script>
<script>
(function () {
  var list = JSON.parse(localStorage.getItem("savedArticles") || "[]");
  var container = document.getElementById("saved-list");

  if (!list.length) {
    document.getElementById("empty-note").style.display = "block";
    return;
  }

  function formatPublishedDate(dateStr) {
    if (!dateStr) return "";
    var parts = dateStr.split("-");
    if (parts.length !== 3) return "";
    return parts[0] + "년 " + parseInt(parts[1], 10) + "월 " + parseInt(parts[2], 10) + "일 발행";
  }

  list.slice().reverse().forEach(function (a) {
    var div = document.createElement("div");
    div.className = "article-card";
    div.dataset.link = a.link;

    var dateLabel = formatPublishedDate(a.date);

    div.innerHTML =
      '<div class="article-source">' +
        '<span class="source-dot"></span>' +
        '<span>' + a.source + '</span>' +
        (dateLabel ? '<span style="margin-left:6px;">· ' + dateLabel + '</span>' : '') +
        '<button type="button" class="save-btn saved" aria-label="저장 취소">★</button>' +
      '</div>' +
      '<div class="article-title">' + a.title + '</div>' +
      '<div class="info-box">' +
        '<div class="label">무슨 내용인가요?</div>' +
        '<div class="body">' + a.summary + '</div>' +
      '</div>' +
      '<a class="original-link" href="' + a.link + '" target="_blank" rel="noopener">원문에서 확인 ↗</a>';

    div.querySelector(".save-btn").addEventListener("click", function () {
      var list2 = JSON.parse(localStorage.getItem("savedArticles") || "[]");
      list2 = list2.filter(function (x) { return x.link !== a.link; });
      localStorage.setItem("savedArticles", JSON.stringify(list2));
      div.remove();
      if (!container.children.length) {
        document.getElementById("empty-note").style.display = "block";
      }
    });

    container.appendChild(div);
  });
})();
</script>
</body>
</html>
